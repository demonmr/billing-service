spring:
  application:
    name: billing-service
  datasource:
    # Phase 4.3 — production uses the shared MSSQL
    # instance. The URL is supplied at runtime via the
    # DB_URL env var (matches every other service in
    # the meta-repo).
    url: ${DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Phase 4.3 — strict validate. V23 (which creates
      # SUBSCRIPTION_PAYMENTS, BILLING_INVOICES,
      # BILLING_WEBHOOK_EVENTS) MUST run before this
      # service is started. The docker-compose ordering
      # has db-migration as a depends_on for every
      # service, so this is the natural safeguard.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
  web:
    error:
      include-message: always

server:
  port: 8089
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-admin:change-me-in-production@localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
auth:
  secure:
    url: ${GATEWAY_URL:http://192.168.5.5:8080}
    internal-token: ${AUTH_INTERNAL_TOKEN:dev-internal-token-change-in-prod}
    introspection-enabled: true
    introspection-fail-open: true
    cache-ttl-seconds: 60
gateway:
  url: ${GATEWAY_URL:http://192.168.5.5:8080}
# Phase 4.3 — billing-specific properties. All
# secrets must come from env vars in production; the
# yml has placeholder defaults for local dev only.
billing:
  liqpay:
    # LiqPay public key (merchant's public identifier,
    # safe to log). Set via BILLING_LIQPAY_PUBLIC_KEY.
    public-key: ${BILLING_LIQPAY_PUBLIC_KEY:sandbox_public_key}
    # LiqPay private key — secret. NEVER log this.
    private-key: ${BILLING_LIQPAY_PRIVATE_KEY:sandbox_private_key}
    # LiqPay's API is a single endpoint for both prod
    # and sandbox; the toggle is the `sandbox` field
    # in the request body. BillingProperties forwards
    # this flag to every checkout request.
    sandbox: ${BILLING_LIQPAY_SANDBOX:true}
  stripe:
    # Stripe secret API key (sk_test_... or sk_live_...).
    api-key: ${BILLING_STRIPE_API_KEY:sk_test_placeholder}
    # Webhook signing secret (whsec_...). Each Stripe
    # webhook endpoint has its own secret. Set via
    # BILLING_STRIPE_WEBHOOK_SECRET.
    webhook-secret: ${BILLING_STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    # API version — pin to 2025-04-30.basil (the
    # version at the time Phase 4.3 ships). Phase 5+
    # may upgrade.
    api-version: ${BILLING_STRIPE_API_VERSION:2025-04-30.basil}
  scheduler:
    # Daily 03:00 — auto-renewal. Configurable for
    # local testing (e.g. "*/30 * * * * *" = every
    # 30s).
    auto-renewal-cron: ${BILLING_AUTO_RENEWAL_CRON:0 0 3 * * *}
  renewal:
    # Phase 4.3 — toggle for testing dunning.
    # When true, every auto-renewal attempt
    # returns false (failure), so the failure
    # counter advances and the 3-strikes
    # deactivation kicks in. Off in production.
    simulate-fail: ${BILLING_RENEWAL_SIMULATE_FAIL:false}

# Phase 4.3 — ShedLock JDBC provider. The lock
# table is auto-created by shedlock-spring on
# startup; we keep the default name `shedlock` to
# match the provider convention.
shedlock:
  providers:
    jdbc:
      table-name: shedlock
  default-lock-at-most-for: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ua.fin.billing: DEBUG
