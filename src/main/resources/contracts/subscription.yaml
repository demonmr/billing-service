openapi: 3.0.3
info:
  title: Subscription Service API
  description: |
    REST API для управління підписками та перевірки доступу до функцій.
    Єдине джерело правди для планів підписок і прав користувачів.
  version: 1.0.0
servers:
  - url: /rest/ua.fin.api/subscriptions
    description: Local development server

security:
  - bearerAuth: []

paths:
  /rest/ua.fin.api/subscriptions/:
    get:
      summary: Get current user subscription info
      description: Returns the active subscription summary for UI feature gating
      operationId: getUserSubscriptionInfo
      tags: [Subscriptions]
      responses:
        '200':
          description: Subscription info retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInfo'
        '401':
          description: Unauthorized

  /rest/ua.fin.api/subscriptions/plans:
    get:
      summary: Get available subscription plans
      description: Returns all available plans users can subscribe to
      operationId: getSubscriptionPlans
      tags: [Subscriptions]
      responses:
        '200':
          description: List of available subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'

  /rest/ua.fin.api/subscriptions/check/{feature}:
    get:
      summary: Check whether the current user has access to a feature
      description: |
        Returns true if the user has an active subscription for the feature,
        false otherwise. This is the hot path used by other services through
        subscription-lib — never throws 403; the lib maps `false` to a
        `SubscriptionRequiredException` locally.
      operationId: checkFeatureAccess
      tags: [Subscriptions]
      parameters:
        - name: feature
          in: path
          required: true
          schema:
            type: string
            enum: [TRANSACTION_ANALYSIS, FIN_CALENDAR, WEALTH_ADVICE, BUDGET_PLANNING, EXPORT_DATA, PREMIUM_REPORTS]
      responses:
        '200':
          description: Access check result
          content:
            application/json:
              schema:
                type: boolean
        '401':
          description: Unauthorized
        '400':
          description: Unknown feature

  /rest/ua.fin.api/subscriptions/activate:
    post:
      summary: Activate a single subscription for the current user
      description: |
        Admin / test endpoint. Activates a single feature for the current
        user. In production this is normally driven by the payment webhook,
        not the user directly.
      operationId: activateSubscription
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateSubscriptionRequest'
      responses:
        '201':
          description: Subscription activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInfo'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /rest/ua.fin.api/subscriptions/order:
    post:
      summary: Order a subscription plan
      description: Creates a new subscription for the current user from a plan
      operationId: orderSubscription
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSubscriptionRequest'
      responses:
        '200':
          description: Subscription created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInfo'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Plan not found

  /rest/ua.fin.api/subscriptions/cancel:
    post:
      summary: Cancel a feature subscription
      operationId: cancelSubscription
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: Subscription cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionInfo'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /rest/ua.fin.api/subscriptions/history:
    get:
      summary: Get subscription history
      description: Returns the user's subscription history including past and current subscriptions
      operationId: getSubscriptionHistory
      tags: [Subscriptions]
      responses:
        '200':
          description: Subscription history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionHistoryEntry'
        '401':
          description: Unauthorized

  # ───────────── Phase 4.8: promo code application ─────────────
  /rest/ua.fin.api/subscriptions/promo/apply:
    post:
      summary: Apply a promo code
      description: |
        Validates a promo code from the V22 PROMO_CODES table and
        atomically increments USED_COUNT. Returns a PromoResult with
        the discount percent so the UI can preview the price reduction
        before the user hits "Subscribe".

        Note: this endpoint does NOT apply the discount to the
        order — that wiring is a Phase 5+ change. Phase 4.8 returns
        the discount for UI preview only.
      operationId: applyPromoCode
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPromoRequest'
      responses:
        '200':
          description: Promo validated (or rejected) successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoResult'
        '400':
          description: Invalid request (missing or blank code)
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        HMAC-SHA256 JWT, отриманий з POST /rest/ua.fin.api/security/user/login.
        Передається у header: Authorization: Bearer <token>
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |-
        Статичний ключ для service-to-service викликів.
        Передається у header: X-API-Key: <key>
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: |-
        Сесійна cookie з auth-service (formLogin / oauth2Login).
        Використовується переважно для HTML-flow.
    oauth2AuthCode:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.fin.local/oauth2/authorize
          tokenUrl: https://auth.fin.local/oauth2/token
          scopes:
            profile: Read user profile
            email: Read user email
            roles: Read user roles
      description: |-
        OAuth2 Authorization Code Flow через auth-service.
        Підтримуються Google/GitHub провайдери.
  schemas:
    SubscriptionInfo:
      type: object
      properties:
        activeFeatures:
          type: array
          items:
            type: string
          description: List of active feature keys the user has access to
        transactionAnalysisEnabled:
          type: boolean
        finCalendarEnabled:
          type: boolean
        wealthAdviceEnabled:
          type: boolean
        budgetPlanningEnabled:
          type: boolean
        exportDataEnabled:
          type: boolean
        premiumReportsEnabled:
          type: boolean
        subscriptionEndDate:
          type: string
          format: date-time
        hasPremiumAccess:
          type: boolean
        # Phase 4.8 — trial dates. Both nullable: null для
        # легасі-рядків та для активованих без тріалу.
        # The max of all active subscription trial windows is
        # returned, parallel to subscriptionEndDate.
        trialStartDate:
          type: string
          format: date-time
        trialEndDate:
          type: string
          format: date-time

    SubscriptionPlan:
      type: object
      properties:
        planId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
          enum: [UAH, USD, EUR]
        billingPeriod:
          type: string
          enum: [MONTHLY, YEARLY, LIFETIME]
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    ActivateSubscriptionRequest:
      type: object
      required: [feature, days]
      properties:
        feature:
          type: string
          description: Feature key to activate
        days:
          type: integer
          description: How many days the subscription stays active
          default: 365

    OrderSubscriptionRequest:
      type: object
      required: [planId]
      properties:
        planId:
          type: string
        autoRenew:
          type: boolean
          default: false

    CancelSubscriptionRequest:
      type: object
      required: [feature]
      properties:
        feature:
          type: string

    SubscriptionHistoryEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: string
        featureKey:
          type: string
        planId:
          type: string
        planName:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, CANCELLED, EXPIRED]
        createdAt:
          type: string
          format: date-time

    # ───────────── Phase 4.8: promo code schemas ─────────────
    ApplyPromoRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          description: The promo code string entered by the user

    PromoResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          description: |
            True if the code was applied successfully; false if the
            code is unknown, inactive, exhausted, or expired.
            UI treats invalid as a form error (not a 500).
        code:
          type: string
          description: The promo code that was attempted
        discountPercent:
          type: integer
          format: int32
          description: |
            The discount percent to apply (0 when invalid). Echoed
            back on success so the UI can preview the price reduction.
        message:
          type: string
          description: |
            Human-readable message. On success: "Promo applied".
            On failure: the rejection reason
            (e.g. "Unknown promo code", "Promo code is inactive",
            "Promo code exhausted", "Promo code expired").
